# Production stack for ichi.mozg.sh.
#
# TLS and ports 80/443 belong to the host's nginx, which already serves mozg.sh
# from the same box — see deploy/nginx-ichi.mozg.sh.conf. The app therefore
# binds to localhost only and is never reachable from outside except through
# nginx.
#
#   cp .env.example .env   # fill it in — see README "Run your own"
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Port 3400 rather than mozg's 3300: the two stacks share a host, and a
# collision here would be discovered as a confusing 502 rather than as an
# error.
#
# Identity is shared with the sibling product. ichi's own Postgres is gone:
# the app joins mozg's network and keeps its tables in an `ichi` schema of
# mozg's database, while user/session/account stay in public owned by mozg.
# One account and one plan across both, without either migration runner ever
# touching the other's tables — see migration 0011 and lib/env.ts.

services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    networks: [mozg]
    environment:
      DATABASE_URL: ${DATABASE_URL:?point this at mozg's Postgres}
      DB_SCHEMA: ${DB_SCHEMA:-ichi}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: https://ichi.mozg.sh
      NEXT_PUBLIC_APP_URL: https://ichi.mozg.sh
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      MODEL_JUDGE: ${MODEL_JUDGE:-claude-haiku-4-5}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3400:3400"

  worker:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    networks: [mozg]
    environment:
      DATABASE_URL: ${DATABASE_URL:?point this at mozg's Postgres}
      DB_SCHEMA: ${DB_SCHEMA:-ichi}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      MODEL_JUDGE: ${MODEL_JUDGE:-claude-haiku-4-5}
      BETTER_AUTH_URL: https://ichi.mozg.sh
      NEXT_PUBLIC_APP_URL: https://ichi.mozg.sh
      NODE_ENV: production
    command: ["node", "dist/worker/index.mjs"]

# mozg's compose owns this network; ichi joins it as a guest so the app can
# reach mozg-db-1 by name. Declared external so `docker compose down` here can
# never take the sibling's network with it.
networks:
  mozg:
    external: true
    name: mozg_default
