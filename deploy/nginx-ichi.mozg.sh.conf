# nginx vhost for ichi.mozg.sh — sits alongside mozg.sh on the same box, so
# nginx stays the single thing holding ports 80/443.
#
#   sudo cp deploy/nginx-ichi.mozg.sh.conf /etc/nginx/sites-available/ichi.mozg.sh
#   sudo ln -s /etc/nginx/sites-available/ichi.mozg.sh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ichi.mozg.sh
#
# certbot rewrites this file to add the TLS lines and a :80 redirect.
#
# Zone names are prefixed `ichi_` and must not collide with mozg's `mozg_`
# zones: limit_req_zone lives in the http context, both files land there, and
# a duplicate name is a fatal error at `nginx -t` rather than a warning.

limit_req_zone $binary_remote_addr zone=ichi_mcp:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=ichi_auth:10m rate=10r/m;

# The MCP ceiling is deliberately looser than it looks. The application already
# enforces 60 calls a minute per token, with a message the agent can act on
# (lib/rate-limit.ts). nginx set tighter than that would stop being a backstop
# and silently become the real policy — returning a bare 429 to an agent midway
# through a task, and tripping constantly for one office behind a single NAT.
# This is the abuse ceiling; the app owns the per-token rule.

server {
    server_name ichi.mozg.sh;

    # The console is one page and the API bodies are small; the generous
    # default is not needed here.
    client_max_body_size 4m;

    # ── MCP ───────────────────────────────────────────────────────────────
    # Agents hold this open. The long read timeout matters: a tool call that
    # waits on the database must not be cut at nginx's 60s default and turned
    # into a 504 the agent reports as "the soul is unavailable".
    location /mcp {
        limit_req zone=ichi_mcp burst=40 nodelay;
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # SSE is a legal MCP answer shape; buffering would hold it hostage.
        proxy_buffering off;
    }

    # ── auth ──────────────────────────────────────────────────────────────
    # Tighter, because this is where password guessing would happen.
    location /api/auth {
        limit_req zone=ichi_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── everything else ───────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
